{% extends 'base.html' %} {% load static %} {% block title %}Sign Up — GP
Calculator{% endblock %} {% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <a href="{% url 'landing' %}" class="navbar-brand">GP CALC</a>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Start calculating your GP today</p>
    </div>

    <form method="POST" action="{% url 'signup' %}">
      {% csrf_token %}

      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            name="full_name"
            placeholder="e.g. Abdulqohar Musa"
            required
          />
        </div>
        <div class="form-group">
          <label>Matric Number</label>
          <input
            type="text"
            name="matric_number"
            placeholder="e.g. CSC/2021/001"
            required
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Department</label>
          <input
            type="text"
            name="department"
            placeholder="e.g. Computer Science"
            required
          />
        </div>
        <div class="form-group">
          <label>Programme</label>
          <input
            type="text"
            name="programme"
            placeholder="e.g. B.Sc Software Engineering"
            required
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Level</label>
          <select name="level">
            <option value="100">100 Level</option>
            <option value="200" selected>200 Level</option>
            <option value="300">300 Level</option>
            <option value="400">400 Level</option>
            <option value="500">500 Level</option>
          </select>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            name="email"
            placeholder="e.g. you@email.com"
            required
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            name="password1"
            placeholder="Min 8 characters"
            required
          />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input
            type="password"
            name="password2"
            placeholder="Repeat password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Create Account
      </button>

      <p class="auth-switch">
        Already have an account?
        <a href="{% url 'login' %}">Login here</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
