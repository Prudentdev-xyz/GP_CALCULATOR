{% extends 'base.html' %} {% load static %} {% block title %}Login — GP
Calculator{% endblock %} {% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <a href="{% url 'landing' %}" class="navbar-brand">GP CALC</a>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Login to access your portal</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="form-group" style="margin-bottom: 16px">
        <label>Email</label>
        <input
          type="email"
          name="email"
          placeholder="e.g. you@email.com"
          required
        />
      </div>

      <div class="form-group" style="margin-bottom: 24px">
        <label>Password</label>
        <input
          type="password"
          name="password"
          placeholder="Your password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-full">Login</button>

      <p class="auth-switch">
        Don't have an account?
        <a href="{% url 'signup' %}">Sign Up here</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
